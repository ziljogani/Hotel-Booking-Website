<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Hotel FOF</title>
    <link rel="icon" type="png" href="FOF.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        /* Navbar */
        .navbar {
            padding: 10px 0;
        }

        .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: gold !important;
        }

        .nav-link.active{
            color:gold !important;
            font-weight: bold;
        }

        .navbar-brand img {
            border-radius: 10px;
        }

        /* Contact Container */
        .form-container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        /* Heading */
        .form-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            color: #111;
        }

        /* Inputs */
        .form-container input,
        .form-container textarea {
            width: 100%;
            margin-bottom: 20px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus{
        border-color: gold;
        box-shadow: 0 0 5px gold;
}

        .form-container input:focus,
        .form-container textarea:focus {
            border-color: gold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Button */
        .form-container button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #111;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-container button:hover {
            background-color: gold;
            color: black;
            transform: scale(1.02);
        }

        /* Map */
        .map-section {
            margin-top: 50px;
        }

        .map-section h3 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        iframe {
            width: 100%;
            height: 400px;
            border-radius: 15px;
        }

        /* Contact Card */
        .card-container {
            margin-top: 30px;
            background-color: #111;
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .card-container h3 {
            margin-bottom: 20px;
        }

        .card-container p {
            margin-bottom: 10px;
            color: #ddd;
        }

        /* Footer */
        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 40px 0;
            margin-top: 50px;
        }

        footer p {
            margin: 0;
        }

        /* Responsive */
        @media(max-width:768px) {

            .form-container {
                padding: 25px;
            }

            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

        <div class="container">

                <img src="FOF.png" alt="TGB Logo" height="70">
                <a class="navbar-brand" href="#">
                FLAVOURS OF FUSION
                </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item mx-2">
                        <a class="nav-link" href="index.html">HOME</a>
                    </li>

                    <li class="nav-item mx-2">
                        <a class="nav-link" href="dining.html">DINING</a>
                    </li>

                    <li class="nav-item mx-2">
                        <a class="nav-link" href="package.html">PACKAGES</a>
                    </li>

                    <li class="nav-item mx-2">
                    <a class="nav-link" href="booking.html">BOOKINGS</a>
                    </li>

                    <li class="nav-item mx-2">
                        <a class="nav-link" href="about.html">ABOUT</a>
                    </li>

                    <li class="nav-item mx-2">
                        <a class="nav-link active" href="contact.html">CONTACT</a>
                    </li>
                </ul>

            </div>

        </div>

    </nav>

    <!-- Contact Form -->
    <div class="form-container">

        <h2>Contact Us</h2>

        <form action="/submit" method="post">

            <input type="text"
                name="name"
                placeholder="Your Name"
                required>

            <input type="email"
                name="email"
                placeholder="Your Email"
                required>

            <textarea name="message"
                rows="5"
                placeholder="Message for more details"
                required></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

        <!-- Map Section -->
        <div class="map-section">

            <h3>Our Location</h3>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3726.7963618463405!2d72.94723537507774!3d20.920510980701856!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be0f700100d94fd%3A0x7d4c0a47d1f63b52!2sFlavors%20of%20Fusion!5e0!3m2!1sen!2sin!4v1743134028573!5m2!1sen!2sin"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>

        </div>

        <!-- Contact Details -->
        <div class="card-container">

            <h3>Contact Details</h3>

            <p>
                <strong>Address:</strong>
                123 Main Street, Surat, Gujarat, India
            </p>

            <p>
                <strong>Email:</strong>
                contact@example.com
            </p>

            <p>
                <strong>Phone:</strong>
                +91-9876543210
            </p>

        </div>

    </div>

    <!-- Footer -->
    <footer>

        <div class="container">

            <p>© 2025 Hotel TGB. All Rights Reserved.</p>

        </div>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
